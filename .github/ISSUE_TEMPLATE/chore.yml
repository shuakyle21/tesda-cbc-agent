name: Chore
description: Maintenance, refactors, tooling, or housekeeping work.
title: "chore: "
labels: ["type:chore", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What maintenance gap exists?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope boundaries
      description: Define the narrow maintenance scope and explicit exclusions.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Completion criteria for this maintenance task.
    validations:
      required: true
  - type: textarea
    id: deps
    attributes:
      label: Dependencies / blockers
      description: Linked issues, infra prerequisites, or access constraints.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification steps
      description: Commands or checks confirming no regressions.
    validations:
      required: true
